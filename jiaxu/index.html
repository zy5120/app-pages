<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>小鱼家序</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:#17211d;background:#f5f7f6}
    *{box-sizing:border-box} body{margin:0;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);line-height:1.65}
    main{max-width:720px;margin:64px auto}.hero{padding:36px;border-radius:28px;background:#fff;box-shadow:0 18px 50px rgba(29,72,55,.08)}
    .mark{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:#e8f3ee;font-size:30px}
    h1{font-size:36px;line-height:1.18;margin:22px 0 10px;letter-spacing:-.02em}p{color:#5c6862;margin:8px 0}
    nav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}a{color:#216b50;text-decoration:none;font-weight:600}
    nav a{padding:16px;border-radius:16px;background:#edf4f1;text-align:center}footer{font-size:13px;color:#83908a;margin:24px 4px}
    @media(max-width:580px){main{margin:28px auto}.hero{padding:26px}nav{grid-template-columns:1fr}h1{font-size:30px}}
    @media(prefers-color-scheme:dark){:root{color:#edf4f0;background:#0d1210}.hero{background:#171d1a}.mark,nav a{background:#203029}p{color:#aab7b0}a{color:#7ed5ae}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="mark" aria-hidden="true">🐟</div>
    <h1>小鱼家序</h1>
    <p>把该存的钱存下，把该花的钱好好花掉。</p>
    <p>一款尊重现实现金流、强调家庭平等与共同约定的家庭记账 App。</p>
    <nav aria-label="小鱼家序相关页面">
      <a href="privacy.html">隐私政策</a>
      <a href="support.html">技术支持</a>
      <a href="testflight.html">测试指南</a>
    </nav>
  </section>
  <footer>小鱼家序 · iOS / iPadOS 26.0 及以上</footer>
</main>
</body>
</html>
