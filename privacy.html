<h1>小鱼六壬 隐私政策</h1>
<p>最后更新：2026年7月13日</p>

<h2>数据收集</h2>
<p>小鱼六壬<strong>不收集任何个人信息</strong>。所有起课历史记录仅存储在您的设备本地，不会上传至任何服务器。</p>

<h2>网络使用</h2>
<p>本应用<strong>无需网络连接</strong>即可使用全部功能。应用不会发起任何网络请求。</p>

<h2>第三方服务</h2>
<p>本应用<strong>不使用任何第三方分析、广告或跟踪服务</strong>。</p>

<h2>数据安全</h2>
<p>由于所有数据存储于设备本地，数据安全由 iOS 系统提供的沙盒机制保障。删除应用即永久清除所有本地数据。</p>

<h2>儿童隐私</h2>
<p>本应用不面向13岁以下儿童，亦不会有意收集儿童的个人信息。</p>

<h2>联系我们</h2>
<p>如有任何隐私相关问题，请联系：Yuu5120@vip.qq.com</p>
